<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПрофСтарт — попробуй профессию</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FC;--surface:#fff;--ink:#14162B;--mute:#5B5F7A;--line:#DDE1F0;--brand:#3B3FD8;--brand-ink:#fff;--ok:#12A37A;--sun:#FFC93C;--sun-ink:#14162B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1020;--surface:#1A1C33;--ink:#EEF0FF;--mute:#A3A8C8;--line:#2D3052;--brand:#8E92FF;--brand-ink:#0F1020;--ok:#3FD6A5}}
:root[data-theme="dark"]{--bg:#0F1020;--surface:#1A1C33;--ink:#EEF0FF;--mute:#A3A8C8;--line:#2D3052;--brand:#8E92FF;--brand-ink:#0F1020;--ok:#3FD6A5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Onest,system-ui,sans-serif}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font:700 20px Unbounded,sans-serif;background:none;border:0;color:var(--ink);padding:0}
.logo b{color:var(--brand)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:8px 14px;border-radius:999px;font-weight:500}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(28px,5vw,46px)}
.lead{color:var(--mute);font-size:18px;max-width:52ch;margin:16px 0 24px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;padding:13px 22px;border-radius:12px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font:700 56px Unbounded,sans-serif;color:var(--ok)}
.tag{display:inline-block;background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600}
.sec-title{font-size:22px;margin:48px 0 16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pt{background:var(--surface);border-radius:14px;padding:18px;border-left:6px solid var(--c)}
.pt h3{font-size:16px;margin-bottom:6px}.pt p{margin:0;color:var(--mute);font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:10px}
.prof:hover{border-color:var(--brand)}
.prof h3{font-size:18px}.prof span{color:var(--mute);font-size:15px}
.crumb{background:none;border:0;color:var(--mute);padding:0;margin-bottom:16px}
.crumb:hover{color:var(--ink)}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;flex-wrap:wrap}
.lvl.lock{opacity:.55}
.lvl small{color:var(--mute);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:8px 0 16px}
.err{color:#D64545;font-size:14px;min-height:20px}
.crit{margin:6px 0;padding:10px 14px;border-radius:10px;background:var(--bg)}
.crit.good{border-left:5px solid var(--ok)}.crit.bad{border-left:5px solid var(--sun)}
.steps{display:flex;gap:6px;margin:12px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.next{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line)}
.next p{margin:0 0 12px;color:var(--mute)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}@media(max-width:820px){.split{grid-template-columns:1fr}}
.badges{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.src{color:var(--brand);font-size:14px;font-weight:500}
.note{font-size:13px;color:var(--mute);margin:0 0 6px}.sh{font-size:14px;margin:18px 0 6px}
.mat{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.55 Onest,sans-serif;margin:0}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:6px 0 10px;gap:8px;flex-wrap:wrap}.card ul{margin:0;padding-left:20px}
</style>
</head>
<body>
<header><div class="bar">
<button class="logo" onclick="go('home')" aria-label="ПрофСтарт — на главную">Проф<b>Старт</b></button>
<nav role="tablist" id="tabs"></nav></div></header>
<main id="app"></main>
<script>
const P={
content:{name:'Контент-маркетолог',short:'Пишет тексты и придумывает, о чём говорить с аудиторией бренда.',tasks:[
{t:'Рерайт и пост для соцсетей',time:10,src:'Stamina AI · стажёр контент-менеджер',url:'https://career.habr.com/vacancies/1000154848',
ctx:'Стартап помогает людям справляться с рабочим стрессом. В вакансии стажёра в обязанностях: переписывать материалы и вести соцсети. Твоя задача — превратить исходный текст в короткий пост.',
mat:'Исходный текст:\nЕсли работать без перерывов, концентрация падает уже через 90 минут. Короткий перерыв на 5–10 минут возвращает внимание, а прогулка помогает лучше, чем смартфон.',
ask:['Пост на 3–5 предложений, своими словами','Первая фраза цепляет читателя','В конце — призыв к действию'],h:'Подсказка: не копируй исходник. Расскажи то же самое так, как сказал бы коллеге.',
ph:'Начни с фразы, которая зацепит…',c:[
[x=>!/концентраци[яи] падает уже через 90 минут/i.test(x),'Текст переписан своими словами.','Исходный текст скопирован. Перескажи его своими словами.',2],
[x=>/перерыв|пауз|отдых/i.test(x),'Главная мысль про перерывы сохранена.','Не потеряй главную мысль исходника: перерывы возвращают внимание.',2],
[x=>{const f=x.split(/(?<=[.!?…])\s/)[0];return f.length<90&&f.length>8},'Первая фраза короткая, её легко прочитать.','Сделай первую фразу короче 90 знаков: она должна зацепить за секунду.',2],
[x=>/приход|заход|попроб|поделись|расскаж|сохран|подпиш|выбер|сделай|встань|выйди/i.test(x),'Есть призыв к действию.','Закончи призывом: «Попробуйте сегодня» или «Расскажите, как отдыхаете вы».',2],
[x=>x.length>=150&&x.length<=700,'Длина подходит для поста.','Нужно 3–5 предложений, примерно 150–700 знаков.',2]]},
{t:'Темы для рассылки',time:12,src:'Sostav.ru · разбор тестовых для контент-маркетолога',url:'https://www.sostav.ru/blogs/280961/77475',
ctx:'Ты работаешь в интернет-магазине кроссовок. Открываемость писем упала. Нужно придумать темы для рассылки об акции и понять, что проверить в первую очередь.',
mat:'Данные:\nОткрываемость писем: июль — 28%, сентябрь — 17%\nАкция: −20% на осенние модели, до воскресенья\nТема прошлой рассылки: «Новости магазина»',
ask:['3 варианта темы письма, каждый с новой строки','Одно предложение: что проверишь первым и почему'],h:'Подсказка: тема с цифрой, вопросом или сроком читается лучше, чем общая фраза.',
ph:'1. …\n2. …\n3. …\nПроверю первым: …',c:[
[x=>x.split('\n').filter(s=>s.trim().length>8).length>=4,'Три темы и пояснение, как просили.','Нужно 3 темы по строкам и ещё одна строка с пояснением.',3],
[x=>/\d/.test(x)||/−|-20|20%/.test(x),'В темах есть цифра или скидка.','Добавь цифру: «−20% до воскресенья».',2],
[x=>/\?/.test(x)||/до воскресенья|успей|только/i.test(x),'Есть вопрос или срок — это подталкивает открыть письмо.','Добавь вопрос или срок акции: «Успеете до воскресенья?».',2],
[x=>/проверю|сравн|тест|a\/b|перв/i.test(x),'Сформулировано, что проверишь первым.','Напиши, что проверишь первым: например, A/B-тест тем.',2],
[x=>x.split('\n').slice(0,3).every(s=>s.length<75),'Темы короткие и читаются целиком.','Сократи темы: в телефоне видно около 40–60 знаков.',1]]}]},
analyst:{name:'Бизнес-аналитик',short:'Находит причины в цифрах и помогает команде принимать решения.',tasks:[
{t:'Формализуй правило',time:10,src:'Контур · стажировка «Системный анализ»',url:'https://kontur.ru/education/internship/internship-analytics',
ctx:'Системный аналитик часто начинает с того, что читает документ и превращает его в понятный алгоритм для разработчиков. Сделай то же с правилом магазина.',
mat:'Правило возврата:\n1. Товар можно вернуть в течение 14 дней, если упаковка не повреждена.\n2. Категория «бельё» возврату не подлежит.\n3. Если товар бракованный, срок возврата — 30 дней, состояние упаковки не важно.',
ask:['Запиши правило шагами в виде «если … то …»','Ответь: можно ли вернуть бракованные наушники в повреждённой упаковке на 20-й день?'],h:'Подсказка: сначала проверь категорию, потом брак, потом срок.',
ph:'Шаг 1. Если …, то …\nШаг 2. …\nОтвет: …',c:[
[x=>(x.match(/если/gi)||[]).length>=2,'Правило записано как «если — то».','Запиши хотя бы 2 условия в формате «если … то …».',3],
[x=>/бель/i.test(x),'Учтено исключение про бельё.','Не забудь исключение: категория «бельё» возврату не подлежит.',2],
[x=>/14/.test(x)&&/30/.test(x),'Названы оба срока: 14 и 30 дней.','Укажи оба срока: 14 дней и 30 дней для брака.',2],
[x=>/да|можно|подлежит/i.test(x)&&!/нельзя|нет,/i.test(x),'Ответ верный: брак можно вернуть на 20-й день.','Ответ неверный. Бракованный товар можно вернуть до 30 дней, упаковка не важна.',3]]},
{t:'Посчитай по таблице',time:12,src:'Контур · стажировка «Анализ данных»',url:'https://kontur.ru/education/internship/internship-data-analytics',
ctx:'Тестовое на эту стажировку проверяет SQL, Python и Power BI. Мы убрали код и оставили суть: аналитик берёт таблицу, считает и делает вывод для команды.',
mat:'Таблица заказов магазина:\nМесяц | Заказы | Отмены\nИюль | 200 | 20\nАвгуст | 250 | 40\nСентябрь | 300 | 75',
ask:['Доля отмен по каждому месяцу в процентах','Месяц с самой высокой долей отмен','Что проверишь, чтобы найти причину'],h:'Подсказка: доля отмен = отмены ÷ заказы × 100.',
ph:'Июль: …%\nАвгуст: …%\nСентябрь: …%\nВывод: …',c:[
[x=>/10\s?%/.test(x)&&/16\s?%/.test(x)&&/25\s?%/.test(x),'Все три доли посчитаны верно: 10%, 16%, 25%.','Проверь расчёты: июль — 10%, август — 16%, сентябрь — 25%.',4],
[x=>/сентябр/i.test(x)&&/(высок|больш|макс|рост|хуже)/i.test(x),'Верно назван сентябрь как месяц с наибольшей долей.','Назови месяц с самой высокой долей отмен.',2],
[x=>/причин|проверю|почему|доставк|склад|канал|товар|цен|срок/i.test(x),'Предложены шаги, как искать причину.','Добавь, что проверишь: причины отмен, сроки доставки, наличие товара.',3],
[x=>x.length>=80,'Вывод записан понятно.','Дополни вывод одним-двумя предложениями.',1]]}]},
logist:{name:'Логист',short:'Выстраивает маршруты и следит, чтобы груз приехал вовремя.',tasks:[
{t:'Стоимость и срок рейса',time:10,src:'hh.ru · практическое задание для кандидата-логиста',url:'https://hh.ru/article/17250',
ctx:'По описанию hh.ru, на собеседовании логисту дают оценить стоимость перевозки и предложить маршрут. Сделай такую прикидку.',
mat:'Груз: 5 тонн, Москва → Казань\nРасстояние: около 820 км\nСтавка перевозчика: 40 ₽ за км\nСредняя скорость фуры: 60 км/ч\nГруз нужен через 2 дня',
ask:['Примерная стоимость рейса','Время в пути и успеем ли в срок','Что ещё учтёшь: отдых водителя, пробки, запас по времени'],h:'Подсказка: стоимость = расстояние × ставка, время = расстояние ÷ скорость.',
ph:'Стоимость: …\nВремя в пути: …\nУспеем: да/нет, потому что …',c:[
[x=>/32\s?800|32,8/.test(x),'Стоимость посчитана верно: 32 800 ₽.','Проверь расчёт: 820 км × 40 ₽ = 32 800 ₽.',4],
[x=>/1[34]\s?(ч|час)|13[.,]\d|14\s?ч/i.test(x),'Время в пути оценено верно: около 14 часов.','Проверь время: 820 ÷ 60 ≈ 14 часов.',3],
[x=>/отдых|смен|ночёв|ночев|перерыв|второй водител|2 водител/i.test(x),'Учтён отдых водителя.','Добавь отдых водителя: за 14 часов нужны остановки или второй водитель.',2],
[x=>/успе|в срок|запас/i.test(x),'Есть вывод по сроку.','Скажи прямо, успеем ли в срок.',1]]},
{t:'Нештатная ситуация',time:15,src:'Cleverence · роль логиста-координатора',url:'https://www.cleverence.ru/articles/sklad-i-logistika/-kak-ustroitsya-v-logisticheskuyu-transportnuyu-kompaniyu-sovety-i-instruktsiya/',
ctx:'В описании профессии логист-координатор распределяет заказы между водителями и решает нештатные ситуации. Вот одна из них.',
mat:'Сейчас 11:00. Фура водителя Ивана сломалась на трассе, опоздание около 4 часов.\nУ клиента окно разгрузки с 14:00 до 16:00.\nВодитель Пётр свободен и находится в 60 км от Ивана.',
ask:['План действий по шагам','Короткое сообщение клиенту'],h:'Подсказка: сначала спасаем груз и срок, затем предупреждаем клиента.',
ph:'1. …\n2. …\nСообщение клиенту: «Здравствуйте, …»',c:[
[x=>/пётр|петр|перегруз|пересад|друг(ой|ого) водител/i.test(x),'Использован свободный водитель.','Подумай, как задействовать Петра: перегрузить груз в его машину.',3],
[x=>/клиент|сообщ|предупред|позвон/i.test(x),'Клиент будет предупреждён.','Предупреди клиента о задержке заранее.',2],
[x=>/окно|перенос|14:00|16:00|слот|время разгрузки/i.test(x),'Учтено окно разгрузки.','Учти окно 14:00–16:00: успеем или нужно договориться о переносе.',2],
[x=>/здравствуйте|добрый|уважаем/i.test(x),'Сообщение клиенту написано вежливо.','Напиши текст сообщения клиенту: «Здравствуйте, …».',2],
[x=>/эвакуатор|сервис|ремонт|диагност/i.test(x),'Подумал про поломанную машину.','Не забудь про Ивана: эвакуатор или сервис.',1]]}]}};
const K=Object.keys(P);
const S={view:'home',prof:null,lvl:0,done:{},last:null,text:''};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(v,p,l){S.view=v;if(p!=null)S.prof=p;if(l!=null)S.lvl=l;S.text='';S.t0=Date.now();render();scrollTo(0,0)}
function tabs(){document.getElementById('tabs').innerHTML=[['home','Главная'],...K.map(k=>[k,P[k].name])].map(([k,n])=>`<button role="tab" aria-selected="${(k==='home'&&S.view==='home')||(k===S.prof&&S.view!=='home')}" onclick="${k==='home'?"go('home')":`go('prof','${k}')`}">${n}</button>`).join('')}
function home(){return `<section class="hero"><div><h1>Попробуй профессию до того, как выберешь свой следующий шаг</h1>
<p class="lead">Короткие задания из реальной работы. Без опыта и резюме: выполни, получи оценку от 1 до 10 и узнай, что улучшить.</p>
<div class="row"><button class="btn" onclick="go('prof','content')">Начать с первого задания</button><button class="btn sec" onclick="document.getElementById('pick').scrollIntoView({behavior:'smooth'})">Выбрать профессию</button></div></div>
<div class="sample" aria-label="Пример результата"><span class="tag">Пример результата</span><div class="score"><b>8</b><span>из 10</span></div>
<p style="margin:8px 0 0"><b>Что получилось:</b> есть чёткий призыв к действию.</p><p style="margin:6px 0 0;color:var(--mute)"><b>Что улучшить:</b> сократить вступление.</p></div></section>
<h2 class="sec-title">Как это работает</h2><div class="grid4">
${[['Практика до устройства на работу','Делаешь настоящие рабочие задачи ещё до первого собеседования.','#3B3FD8'],['Понятный результат','Оценка 1–10 и короткий разбор: что хорошо, что улучшить.','#12A37A'],['Небольшой порог входа','Опыт не нужен. Каждое задание решается за 5–10 минут.','#FFC93C'],['Следующий шаг','Усложни задачу или сразу попробуй другую сферу.','#E5527A']].map(([a,b,c])=>`<div class="pt" style="--c:${c}"><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>
<h2 class="sec-title" id="pick">Выбери сферу</h2><div class="grid3">${K.map(k=>`<button class="prof" onclick="go('prof','${k}')"><h3>${P[k].name}</h3><span>${P[k].short}</span><span><b>${P[k].tasks.length} задания</b>, от простого к сложному${S.done[k]?' · пройдено: '+S.done[k].filter(x=>x!=null).length:''}</span></button>`).join('')}</div>`}
function prof(){const p=P[S.prof],d=S.done[S.prof]||[];return `<button class="crumb" onclick="go('home')">← На главную</button><h1 style="font-size:clamp(26px,4vw,38px)">${p.name}</h1><p class="lead">${p.short}</p>
${p.tasks.map((t,i)=>{const lock=i>0&&d[i-1]==null;return `<div class="lvl ${lock?'lock':''}"><div><b>Уровень ${i+1}: ${t.t}</b><small>${t.time} мин · ${t.src}${d[i]!=null?' · твой балл: '+d[i]+'/10':''}</small></div>${lock?'<small>Сначала пройди уровень '+i+'</small>':`<button class="btn ${d[i]!=null?'sec':''}" onclick="go('task',null,${i})">${d[i]!=null?'Пройти ещё раз':'Начать задание'}</button>`}</div>`}).join('')}
<div class="next"><p>Не уверен, что это твоё? Попробуй другую сферу, это тоже результат.</p><div class="row">${K.filter(k=>k!==S.prof).map(k=>`<button class="btn sec" onclick="go('prof','${k}')">${P[k].name}</button>`).join('')}</div></div>`}
function task(){const p=P[S.prof],t=p.tasks[S.lvl];return `<button class="crumb" onclick="go('prof')">← ${p.name}</button><div class="steps" aria-label="Уровни">${p.tasks.map((_,i)=>`<i class="${i<=S.lvl?'on':''}"></i>`).join('')}</div>
<h1 style="font-size:clamp(24px,4vw,34px);margin-top:12px">Уровень ${S.lvl+1}: ${t.t}</h1>
<div class="split"><div class="card"><div class="badges"><span class="tag">⏱ ${t.time} минут</span><a class="src" href="${t.url}" target="_blank" rel="noopener">Основа: ${t.src}</a></div>
<p class="note">Компании не публикуют тексты своих тестовых. Условия ниже собраны по открытым описаниям и сокращены до 10–15 минут.</p>
<h3 class="sh">Ситуация</h3><p style="margin:0">${t.ctx}</p>
<h3 class="sh">Материал</h3><pre class="mat">${esc(t.mat)}</pre>
<h3 class="sh">Что нужно сдать</h3><ul>${t.ask.map(a=>`<li>${a}</li>`).join('')}</ul><p class="hint">${t.h}</p></div>
<div class="card"><label for="ans"><b>Твой ответ</b></label><textarea id="ans" style="margin-top:8px;min-height:260px" placeholder="${esc(t.ph)}" oninput="S.text=this.value;cnt()">${esc(S.text)}</textarea>
<div class="meta"><span id="cnt">0 знаков</span><span>Время: <b id="tm">0:00</b> · ориентир ${t.time} мин</span></div><div class="err" id="err" role="alert"></div>
<div class="row"><button class="btn" onclick="submit()">Отправить на проверку</button><button class="btn sec" onclick="go('prof')">Выйти без сохранения</button></div></div></div>`}
function cnt(){const e=document.getElementById('cnt');if(e)e.textContent=S.text.length+' знаков'}
function submit(){const x=S.text.trim(),t=P[S.prof].tasks[S.lvl];if(x.length<30){document.getElementById('err').textContent='Ответ слишком короткий. Напиши хотя бы пару предложений.';return}
let tot=0,got=0;const r=t.c.map(([f,ok,bad,w])=>{const y=f(x);tot+=w;if(y)got+=w;return{y,m:y?ok:bad}});
const sc=Math.max(1,Math.round(10*got/tot));S.last={sc,r};(S.done[S.prof]=S.done[S.prof]||[])[S.lvl]=sc;go('result')}
function result(){const p=P[S.prof],{sc,r}=S.last,more=S.lvl+1<p.tasks.length,other=K.filter(k=>k!==S.prof);
const head=sc>=8?'Отличная работа':sc>=5?'Хороший старт':'Первый шаг сделан';
return `<h1 style="font-size:clamp(24px,4vw,34px)">${head}</h1><div class="card"><div class="score"><b style="color:${sc>=5?'var(--ok)':'var(--brand)'}">${sc}</b><span>из 10</span></div>
<h3 style="font-size:16px;margin:18px 0 8px">Что получилось</h3>${r.filter(c=>c.y).map(c=>`<div class="crit good">${c.m}</div>`).join('')||'<div class="crit good">Ты довёл задание до конца — уже результат.</div>'}
<h3 style="font-size:16px;margin:18px 0 8px">Что можно улучшить</h3>${r.filter(c=>!c.y).map(c=>`<div class="crit bad">${c.m}</div>`).join('')||'<div class="crit good">Всё учтено. Пора браться за задачу посложнее.</div>'}
<div class="next"><p><b style="color:var(--ink)">Что дальше?</b> ${more?'Можно усложнить задачу или попробовать другую сферу.':'Ты прошёл все уровни в этой сфере. Попробуй другую.'}</p><div class="row">
${more?`<button class="btn" onclick="go('task',null,${S.lvl+1})">Следующее задание: сложнее</button>`:`<button class="btn" onclick="go('prof','${other[0]}')">Попробовать: ${P[other[0]].name}</button>`}
<button class="btn sec" onclick="go('task',null,${S.lvl})">Повторить и улучшить</button>
${more?`<button class="btn sec" onclick="go('prof','${other[0]}')">Это не моё — другая сфера</button>`:`<button class="btn sec" onclick="go('prof')">К списку уровней</button>`}</div></div></div>`}
function render(){tabs();clearInterval(S.iv);document.getElementById('app').innerHTML={home,prof,task,result}[S.view]();if(S.view==='task'){S.iv=setInterval(()=>{const e=document.getElementById('tm');if(!e)return;const q=Math.floor((Date.now()-S.t0)/1000);e.textContent=Math.floor(q/60)+':'+String(q%60).padStart(2,'0')},1000)}}
render();
</script>
</body>
</html>
